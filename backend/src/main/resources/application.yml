spring:
  application:
    name: exchange-ops-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/exchangeops}
    username: ${SPRING_DATASOURCE_USERNAME:exchangeops}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      pool-name: exchangeops-pool
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  data:
    web:
      pageable:
        default-page-size: 25
        max-page-size: 200
        one-indexed-parameters: false

server:
  port: ${BACKEND_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  generator:
    interval-ms: ${GENERATOR_INTERVAL_MS:1000}
    events-per-cycle: ${GENERATOR_EVENTS_PER_CYCLE:1}
    random-seed: ${GENERATOR_RANDOM_SEED:2026}

logging:
  level:
    root: INFO
    com.deepak.exchangeops: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX,UTC} %-5level [%thread] %logger{36} - %msg%n"
