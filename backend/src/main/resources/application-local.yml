# Local development profile.
#
# Every value below is a non-secret localhost default matching the `postgres` service in
# docker-compose.yml, so `docker compose up -d postgres` plus this profile works with no
# further setup. Real deployments override these through environment variables.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/exchangeops}
    username: ${SPRING_DATASOURCE_USERNAME:exchangeops}
    password: ${SPRING_DATASOURCE_PASSWORD:exchangeops_local_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

logging:
  level:
    com.deepak.exchangeops: DEBUG
    org.flywaydb: INFO
