services:
  postgres:
    image: postgres:16
    container_name: exchange-ops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-exchange_ops}
      POSTGRES_USER: ${POSTGRES_USER:-exchange_ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exchange_ops}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - exchange_ops_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-exchange_ops} -d ${POSTGRES_DB:-exchange_ops}"
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - exchange_ops_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: exchange-ops-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-exchange_ops}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-exchange_ops}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-exchange_ops}
      SERVER_PORT: 8080
      GENERATOR_INTERVAL_MS: ${GENERATOR_INTERVAL_MS:-1000}
      GENERATOR_EVENTS_PER_CYCLE: ${GENERATOR_EVENTS_PER_CYCLE:-1}
      GENERATOR_RANDOM_SEED: ${GENERATOR_RANDOM_SEED:-2026}
      METRICS_BROADCAST_ENABLED: ${METRICS_BROADCAST_ENABLED:-true}
      METRICS_BROADCAST_INTERVAL_MS: ${METRICS_BROADCAST_INTERVAL_MS:-2000}
      METRICS_BROADCAST_INITIAL_DELAY_MS: ${METRICS_BROADCAST_INITIAL_DELAY_MS:-3000}
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://localhost:8080/api/v1/health"
        ]
      interval: 10s
      timeout: 5s
      start_period: 25s
      retries: 10
    networks:
      - exchange_ops_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: exchange-ops-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - exchange_ops_network

volumes:
  exchange_ops_postgres_data:

networks:
  exchange_ops_network:
    driver: bridge
